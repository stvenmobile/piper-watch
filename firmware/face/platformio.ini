; Piper's face - the Guition ESP32-2432S024 (2.4" CYD, ILI9341 320x240) in the head:
; animated eyes on the screen + the 12-LED NeoPixel ring "mouth" round the camera.
; Link to the Pi/Orin: USB (the board's CH340), 115200 baud, newline JSON - see src/main.cpp.
;
;   pio run -e cyd24 -t upload        (from this folder)
;   pio device monitor                  shows the STATUS lines; it runs a demo until the first heartbeat

[env:cyd24]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  lovyan03/LovyanGFX@1.1.16
  adafruit/Adafruit NeoPixel@1.12.3
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -DTFT_BL=27              ; backlight (2.4" CYD; the 2.8" uses 21)
  -DTFT_ROTATION=1         ; landscape; 3 if the picture is upside down
  -DTFT_INVERT=0           ; 1 if the colours come out inverted (some IPS panels)
  -DTFT_BGR=1              ; 0 if red and blue are swapped
  -DRING_DATA=22           ; the mouth's data line: IO22 (on the CN1 and P3 connectors)
  -DRING_N=12              ; Adafruit NeoPixel Ring 12
