; Piper-Watch head controller - LCDWiki E32R40T (ESP32-32E, ST7796S 320x480, XPT2046 touch)
; Pins from https://www.lcdwiki.com/4.0inch_ESP32-32E_Display

[env:e32r40t]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  ; Feetech SCServo (SMS_STS) library for the STS3215 bus servos - added with the servo code
build_flags =
  ; --- TFT_eSPI configured here, no User_Setup.h edits ---
  -DUSER_SETUP_LOADED=1
  -DST7796_DRIVER=1
  -DUSE_HSPI_PORT=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=27
  -DTFT_BACKLIGHT_ON=HIGH
  -DTOUCH_CS=33
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSMOOTH_FONT=1
  ; --- Board pins used by Piper-Watch (see README "Wiring and pins") ---
  -DSERVO_BUS_TX=25
  -DSERVO_BUS_RX=32
  -DLED_R=22
  -DLED_G=16
  -DLED_B=17
