; Piper-Watch controller - ESP32-S3 DevKitC-1 N16R8 (16 MB flash, 8 MB octal PSRAM)
; Pins: see the README, "Wiring and pins".

[env:s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi      ; N16R8: quad flash + octal PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200                          ; ignored by native USB, kept for the monitor
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.3
  ; Feetech SCServo (SMS_STS) library for the STS3215 bus servos - added with the servo code
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1            ; native USB (the board's "USB" port) ...
  -DARDUINO_USB_CDC_ON_BOOT=1     ; ... is the serial port to the Jetson
  -DSERVO_BUS_TX=17
  -DSERVO_BUS_RX=18
  -DRING_DATA=8                  ; 24-LED ring data (via a 3.3 V -> 5 V level shifter)
