; Bring-up firmware for the CrowPanel Advanced 7" ESP32-P4 (Elecrow DHE04107D, hardware V1.0):
; EK79007 1024x600 IPS over 2-lane MIPI-DSI, GT911 touch, backlight PWM on GPIO31.
;
;   pio run -t upload            (plug the board's USB-UART port; add --upload-port COMx if needed)
;   pio device monitor           (115200; type ? and Enter)
;
; The first build downloads the pioarduino ESP32 platform (Arduino-ESP32 3.x) - several hundred MB.

[env:crowpanel_p4_7]
; 55.03.39 = Arduino-ESP32 3.3.9 / ESP-IDF 5.5.4, the newest release that runs on PlatformIO Core 6.1.19
; (later ones need Core 6.2). Same release Elecrow pins for their CrowPanel Advance examples.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-p4                  ; the early P4 (chip revision < 3) that Elecrow's V1.0 uses; a rev-3 chip
                                  ; needs board = esp32-p4_r3 (the boot log says "Chip is ESP32-P4 (revision v1.x)")
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
