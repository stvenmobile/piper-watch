; Piper's face on a CrowPanel Advanced ESP32-P4. One env per panel:
;   crowpanel_p4_5   5" (Elecrow DHE04005D, V1.0/V1.1 - same wiring): 800x480 IPS, 16-bit parallel RGB,
;                    GT911 touch, backlight through the STC8 helper MCU (I2C 0x2F). The final head. [default]
;   crowpanel_p4_7   7" (Elecrow DHE04107D V1.0): EK79007 1024x600 IPS over 2-lane MIPI-DSI, GT911 touch,
;                    backlight PWM on GPIO31. The bench panel.
;
;   pio run -t upload --upload-port COM4            (the default env: the 5")
;   pio run -e crowpanel_p4_7 -t upload             (the 7")
;   pio device monitor -p COM4                      (115200; type ? and Enter)
;
; Both boards use the early P4 (chip revision < 3; Elecrow's sdkconfigs for both say so). A rev-3 chip needs
; board = esp32-p4_r3 (the boot log says "Chip is ESP32-P4 (revision v1.x)").
; The first build downloads the pioarduino ESP32 platform (Arduino-ESP32 3.x) - several hundred MB.
;
; Version: 1.1.0   Created: 2026-11-23   Last modified: 2026-11-26
; History: 1.0.0 2026-11-23 7" env.
;          1.1.0 2026-11-26 shared [env]; 5" env (PANEL_* build flags).

[platformio]
default_envs = crowpanel_p4_5

[env]
; 55.03.39 = Arduino-ESP32 3.3.9 / ESP-IDF 5.5.4, the newest release that runs on PlatformIO Core 6.1.19
; (later ones need Core 6.2). Same release Elecrow pins for their CrowPanel Advance examples.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-p4
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM

[env:crowpanel_p4_5]
build_flags =
    ${env.build_flags}
    -DPANEL_5IN_RGB

[env:crowpanel_p4_7]
build_flags =
    ${env.build_flags}
    -DPANEL_7IN_DSI
