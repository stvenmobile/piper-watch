; OLED bring-up for the head's XIAO ESP32-S3 + the 2.08" SH1122 256x64 OLED (7-pin SPI).
;   GND-GND  VCC-3V3  SCL-D8 (GPIO7, SCK)  SDA-D10 (GPIO9, MOSI)  RST-D1 (GPIO2)  DC-D0 (GPIO1)  CS-D5 (GPIO6)
;
;   pio run -t upload        (from this folder)
;   pio device monitor

[env:xiao]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
  olikraus/U8g2@2.35.30
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
